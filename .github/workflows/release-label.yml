# Release-label gate (ADR 0090 §D): every PR carries exactly one release:* label.
#
# Lives OUTSIDE full-check.yml on purpose: this is the only check that must
# re-evaluate on labeled/unlabeled events. Keeping those triggers here means
# applying a label re-runs a ~4s job instead of the whole gate — the heavy
# checks' green on the same SHA stays untouched, and an in-flight full-check
# run is not cancelled by labeling. (Do NOT fold this back into full-check
# with job-level `if` on event action: a label event would then overwrite the
# heavy contexts with "skipped", which SATISFIES required checks — a gate hole.)
name: Release label

# `edited` is in the trigger list because this job also validates the PR TITLE
# (the squash-merge subject candidate) against Conventional Commits — a title
# fix must re-run the ~4s gate (v0.61.6 changelog hole, 2026-07-29).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    name: Release label (exactly one release:*)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Deliberately NO `uses:` actions (guardrail 2026-08-06): during a GitHub
      # Actions incident the runner could not even resolve actions/checkout
      # ("Failed to resolve action download info: Service Unavailable" in Set
      # up job), reddening this gate while the label sat correctly on the PR.
      # This is the job the owner's labeled/unlabeled events re-run at merge
      # time, so it depends only on what the runner image already ships
      # (git + gh): a shallow clone of the default branch (the gate's script +
      # Makefile — label data comes from the API, not the tree), then the same
      # make target as before.
      - name: Check release label
        run: |
          gh repo clone "$GITHUB_REPOSITORY" gate -- --depth 1
          cd gate && make check-release-label PR=${{ github.event.pull_request.number }}
