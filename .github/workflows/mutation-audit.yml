name: Mutation audit (advisory)

# Advisory, never blocking (ADR 0096 decision 5): findings become tracked
# cards, never a merge blocker. Auto-triggers on master pushes touching the
# five risk paths below, plus manual dispatch:
#   gh workflow run mutation-audit.yml [-f shard=1/8] [-f build_jobs=4]
# cargo-mutants sweeps take 30 min-2 h and rebuild+retest per mutant, so they
# run on a standard ubuntu-latest runner (the owner's WSL box OOM-froze twice
# running this locally), never in the PR-blocking gate.
on:
  push:
    branches: [master]
    paths:
      - 'src-tauri/src/fundamentals/expr/**'
      - 'src-tauri/src/storage/migrations.rs'
      - 'src-tauri/src/storage/feed_matching.rs'
      - 'src-tauri/src/source_adapters/parsing.rs'
      - 'src-tauri/src/entity_resolution.rs'
  workflow_dispatch:
    inputs:
      shard:
        description: 'cargo-mutants shard k/n, k 0-INDEXED: a full 8-way sweep is 0/8..7/8 (8/8 is a usage error; empty = full sweep)'
        required: false
        default: ""
      build_jobs:
        description: "CARGO_BUILD_JOBS for the mutant/baseline builds"
        required: false
        default: "4"

# Per-shard group, split by triggering event: a full dispatch sweep runs all 8
# shards AT ONCE in parallel (~1h wall instead of ~6h sequential); duplicate
# dispatches of the SAME shard still cancel each other (#241, 2026-07-29).
# Keying on event_name too keeps push-triggered sweeps from cancelling an
# in-flight manual dispatch (or vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.shard || 'push' }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants sweep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Reclaim disk space
        # Headroom for the sweep's scratch tree + per-mutant rebuild artifacts
        # (~25-30 GB freed, same reclaim as the full-check heavy jobs). NOTE:
        # telemetry disproved disk exhaustion as the runner-death cause — the
        # real killer was mutant memory bombs; see the jail in the sweep step.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      - name: Add swap
        # Headroom so legitimate build/test spikes page instead of pressuring
        # the VM; the hard cap against mutant memory bombs is the cgroup jail
        # in the sweep step (telemetry showed swap untouched at death — swap
        # alone cannot outpace a tight allocation loop).
        run: |
          sudo fallocate -l 8G /mnt/extra-swap
          sudo chmod 600 /mnt/extra-swap
          sudo mkswap /mnt/extra-swap
          sudo swapon /mnt/extra-swap
          free -h
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-
            ${{ runner.os }}-cargo-

      # Nix (not a bare rust-toolchain action) because `make audit-mutants`
      # shells out via `$(NIX) = nix develop -c`: the default devShell (flake.nix)
      # already pins the Rust toolchain, cargo-mutants, cargo-nextest, and the
      # Linux Tauri system libraries (gtk3, webkitgtk_4_1, ...) needed to
      # compile src-tauri, so no separate rustup/apt-get step is needed here —
      # this mirrors how release.yml builds the same Rust workspace.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No jail: MUTANTS_JAIL=off skips the systemd-run --user memory jail
      # (Makefile), which needs a user systemd manager that a GitHub-hosted
      # runner does not have. The sweep's own exit code is CAPTURED, not
      # propagated here — the "Sweep verdict" step below turns it into the
      # job's red/green (#256); the run is NOT forced green, and the artifact
      # upload is unconditional (`if: always()`) so the report is available
      # however the verdict lands.
      - name: Run mutation sweep
        id: sweep
        # Memory jail via a root cgroup: mutants can turn a loop into a memory
        # bomb (the class the TIMEOUT auto-limit cannot catch when allocation
        # outruns it) — a <60s burst freezes the VM and the runner agent misses
        # heartbeats ("runner received a shutdown signal"). Proven 2026-07-29 by
        # streamed telemetry: death with 81G disk free, 13.6G RAM free, swap
        # untouched — resources were healthy one tick earlier. The same sweep
        # OOM-froze the owner's 16 GB WSL twice; the Makefile's systemd-run jail
        # needs a user systemd manager this runner lacks, so cap a cgroup
        # directly: the bomb OOMs INSIDE the cgroup (mutant recorded as caught /
        # unviable) and the sweep continues.
        #
        # The TELEMETRY loop streams disk/memory into the live log every 60s —
        # the only channel that survives a runner death (artifacts and later
        # steps do not run when the agent is lost).
        #
        # BUILD_JOBS/SHARD resolve here, not inline: on a push trigger the
        # `inputs` context is entirely empty (it only exists for
        # workflow_dispatch), so an inline `${{ inputs.build_jobs }}` would pass
        # `MUTANTS_BUILD_JOBS=` (empty) on the make command line — an empty
        # command-line variable still overrides the Makefile's `?= 2` default
        # and exports an empty, unbounded CARGO_BUILD_JOBS. BUILD_JOBS falls
        # back to 4; SHARD is passed to make only when non-empty, so an unset
        # shard runs the Makefile's own default (full sweep) instead of an
        # explicit empty override.
        env:
          BUILD_JOBS: ${{ inputs.build_jobs || '4' }}
          SHARD: ${{ inputs.shard }}
        run: |
          sudo mkdir -p /sys/fs/cgroup/mutants
          echo 12G | sudo tee /sys/fs/cgroup/mutants/memory.max
          echo 2G | sudo tee /sys/fs/cgroup/mutants/memory.swap.max
          echo $$ | sudo tee /sys/fs/cgroup/mutants/cgroup.procs
          ( while true; do
              echo "TELEMETRY $(date -u +%H:%M:%S) disk_avail=$(df --output=avail -h / | tail -1 | xargs) mem_avail_mb=$(free -m | awk '/Mem:/{print $7}') swap_used_mb=$(free -m | awk '/Swap:/{print $3}')"
              sleep 60
            done ) &
          TELEM_PID=$!
          rc=0
          make audit-mutants MUTANTS_JAIL=off \
            MUTANTS_BUILD_JOBS="$BUILD_JOBS" \
            ${SHARD:+MUTANTS_SHARD="$SHARD"} || rc=$?
          kill "$TELEM_PID" 2>/dev/null || true
          # GNU make maps every failed recipe to its own exit 2, swallowing
          # cargo-mutants' code (the 2026-07-31 sweep failed 3 timeout-only
          # shards as "exit 2"). The recipe persists the true code to a marker
          # file; make's status is only the fallback when the file is absent
          # (recipe died before cargo-mutants ran — no proof, stays red).
          ec_file=src-tauri/mutants.out/cargo-mutants-exit-code
          if [ -f "$ec_file" ]; then rc=$(cat "$ec_file"); fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"

      # #256: cargo-mutants encodes the sweep result in its exit code — 0 all
      # caught, 2 mutants MISSED, 3 mutants TIMED OUT, 1/4 usage or baseline
      # failure. A timeout is caught-by-limit, not a survivor, so a run with 0
      # missed and only timeouts is a PASS with a notice: the 2026-07-30 full
      # sweep (288 mutants, 0 missed, one timeout on shards 3/4/7) went red on
      # exit 3 alone and sent triage hunting a survivor that did not exist.
      # Everything else stays red — exit 1/2/4, an unset exit code, and exit 3
      # WITH missed mutants (cargo-mutants may report either code when a run
      # both misses and times out, so the missed tally, never the code alone,
      # decides). `missed.txt` is the tally cargo-mutants writes for exactly
      # this question, so the verdict never re-derives it from the log — and a
      # missing tally file cannot buy the timeout pass either: no report, no
      # proof that nothing survived, so the job stays red.
      - name: Sweep verdict
        # Inputs/outputs arrive as env, never interpolated into the script body
        # (a dispatch input is caller-controlled text, not shell).
        env:
          RC: ${{ steps.sweep.outputs.rc }}
          SHARD: ${{ inputs.shard }}
        run: |
          rc="$RC"
          missed_file=src-tauri/mutants.out/missed.txt
          missed=0
          tally_known=0
          if [ -f "$missed_file" ]; then
            tally_known=1
            if [ -s "$missed_file" ]; then missed=$(grep -c '' "$missed_file"); fi
          fi
          {
            echo "### cargo-mutants sweep — ${SHARD:-full sweep}"
            echo ""
            echo "- cargo-mutants exit code: \`${rc:-<unset>}\`"
            echo "- missed mutants: \`$missed\`"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "0" ]; then
            echo "- verdict: **pass** — every mutant caught." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" = "3" ] && [ "$tally_known" = "1" ] && [ "$missed" -eq 0 ]; then
            echo "::notice::cargo-mutants exit 3 = timeouts only, 0 mutants missed — caught by the timeout limit, not survivors (#256)."
            echo "- verdict: **pass with timeouts** — nothing survived (#256)." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::cargo-mutants sweep failed: exit ${rc:-<unset>}, $missed missed mutants — see the mutants-out artifact."
          echo "- verdict: **fail** — see the \`mutants-out\` artifact." >>"$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out
          path: src-tauri/mutants.out
          retention-days: 7
          if-no-files-found: warn
