# Build the devshell container image consumed by full-check.yml (ADR 0090 §B,
# decision 9). The image pre-realizes the default Nix devShell into /nix/store so
# each check job's `nix develop -c` resolves in ~seconds instead of installing
# and evaluating Nix per job. Rebuilt when the flake changes; also on demand
# (seed this once before the first full-check run).
name: Devshell image

on:
  push:
    branches: [master]
    paths:
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brawler-devshell

jobs:
  build:
    name: Build and push devshell image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # nixos/nix base + GNU make/git/bash/coreutils on PATH (the workflow calls
      # `make`/`git` OUTSIDE nix develop) + the default devShell pre-realized into
      # the store, so `nix develop -c` in full-check reuses cached paths.
      - name: Write Dockerfile
        run: |
          cat > Dockerfile.devshell <<'DOCKER'
          # glibc (FHS) base is REQUIRED: GitHub mounts its JS actions' node binary
          # into job containers, and it needs the standard dynamic loader. The
          # previous nixos/nix base broke every actions/* step with
          # "exec /__e/node24/bin/node: no such file or directory".
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates curl git make xz-utils \
              && rm -rf /var/lib/apt/lists/*
          # System libraries for Playwright's downloaded Chromium (headless shell
          # dlopens these from the OS): without them the browser shards die with
          # "error while loading shared libraries: libnspr4.so".
          RUN apt-get update && apt-get install -y --no-install-recommends \
                libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
                libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
                libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
                libatspi2.0-0t64 fonts-liberation \
              && rm -rf /var/lib/apt/lists/*
          # Container-friendly Nix install (no init system, flakes enabled).
          RUN curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
              | sh -s -- install linux --init none --no-confirm
          ENV PATH="/nix/var/nix/profiles/default/bin:${PATH}"
          WORKDIR /build
          COPY flake.nix flake.lock ./
          RUN nix develop --command true
          DOCKER

      - name: Build image
        run: docker build -f Dockerfile.devshell -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
