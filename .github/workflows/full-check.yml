# Full check — the single distributed gate (ADR 0090, coverage jobs ADR 0096).
#
# One definition, run at every boundary: on each PR (required checks), on each
# master push via release.yml (workflow_call), and on demand (workflow_dispatch).
# There is no "fast" mode in CI — "fast" lives only in the local developer inner
# loop (`make check-local`). Every check-executing step is a thin `make <target>`
# wrapper (scripts/check/gate-integrity.mjs asserts this), so the same thing runs
# identically here and locally.
#
# Environment: the Linux check jobs run inside the pre-baked devshell image
# (devshell-image.yml → ghcr.io/wbednarczyk/brawler-devshell) so `nix develop -c`
# resolves in ~seconds instead of installing Nix per job. If that image is
# unavailable, the documented fallback is to drop the `container:` line and add
# an `install-nix-action` step (see mutation-audit.yml) to each job.
name: Full check

on:
  pull_request:
    # NOTE deliberately NO labeled/unlabeled here: label events re-run only the
    # tiny release-label.yml workflow, so green heavy checks on the same SHA
    # stay untouched (and an in-flight run is not cancelled by labeling).
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: a docs-only PR skips the heavy code/browser/windows jobs. The
  # skipped jobs still SATISFY required checks (GitHub treats an `if:`-skipped
  # required job as met), mirroring the local docs-only → `make check-docs` path.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # every = a file counts as code only when it matches ALL patterns
          # (matches '**' AND is not docs/wiki/markdown). The default 'some'
          # OR-s the list, so '**' alone made EVERY changeset "code" and the
          # docs-only fast path never fired (found live on PR #233, 2026-07-29).
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!wiki/**'
              - '!**/*.md'

  rust-lint:
    name: Rust lint (fmt + clippy)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      # Restore-only: the canonical writer is rust-test (cache discipline — one
      # writer, 10 GB/repo budget). save-if:false → never writes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false
      - name: Reclaim disk space
        run: rm -rf /opt/hostedtoolcache || true
      - run: make check-rust-lint

  rust-test:
    name: Rust tests (nextest + doc)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      # The ONE canonical cargo cache writer (save-if default true).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Reclaim disk space
        run: rm -rf /opt/hostedtoolcache || true
      - run: make check-rust-test

  rust-coverage:
    name: Rust coverage ratchet
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      # Second cache-writer family, key "coverage" (ADR 0096 amends ADR 0090's
      # one-writer rule to one-writer-per-key-family): instrumented cargo-llvm-cov
      # artifacts don't share with the plain test-build cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Reclaim disk space
        run: rm -rf /opt/hostedtoolcache || true
      - run: make install
      - run: make coverage-rust

  types-check:
    name: ts-rs binding drift
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false
      - name: Reclaim disk space
        run: rm -rf /opt/hostedtoolcache || true
      - run: make types-check

  frontend-static:
    name: Frontend static (typecheck + eslint + stylelint + knip)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: make install
      - run: make check-frontend-static

  frontend-test:
    name: Frontend tests (vitest)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: make install
      - run: make check-frontend-test

  frontend-coverage:
    name: Frontend coverage ratchet
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: make install
      - run: make coverage-frontend

  frontend-build:
    name: Frontend build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: make install
      - run: make check-frontend-build

  browser:
    name: Browser (Playwright shard ${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 4 shards: ~3-4 min fixed overhead per shard + ~2-3 min tests puts the
        # browser lane under rust-test/windows-build on the critical path.
        # More shards = overhead eats the gain. Ruleset contexts must match.
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Reclaim disk space
        run: rm -rf /opt/hostedtoolcache || true
      - run: make install
      # Pixel snapshots auto-disable under CI=true (Playwright config); this
      # asserts behavior/layout, not baselines.
      - run: make check-browser SHARD=${{ matrix.shard }}

  # Dependency scanning (issue #167). Code-scoped like the other code jobs: a
  # docs-only PR changes no dependency tree. Unlike every other check job this
  # one is deliberately NETWORK-dependent — cargo-deny fetches the RustSec
  # advisory DB and `npm audit` queries the registry — which is why it lives in
  # the full gate only and never in `make check-local`.
  deps:
    name: Dependency scan (cargo-deny + npm audit)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - run: make check-deps

  docs-gates:
    name: Docs gates (gate-integrity + docs-drift)
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - run: make check-docs-gates

  commit-lint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history so the PR commit range is walkable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - run: make check-commits RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Windows = first-class platform (ADR 0090 §B2): cross-build the portable .exe
  # on every code-touching PR. Uses install-nix-action (the windows-cross devShell
  # is not in the default devshell image) + the same caches as the old
  # release-artifacts.yml. Redirects the copy target into the workspace (the
  # runner has no /mnt/d). Artifact retained 3 days for owner hands-on
  # (`make pr-binary PR=n`).
  windows-build:
    name: Windows cross-build (.exe)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false
      - name: Cache cargo-xwin SDK data
        uses: actions/cache@v6
        with:
          path: .xwin-cache
          key: ${{ runner.os }}-xwin-${{ hashFiles('flake.lock') }}
          restore-keys: ${{ runner.os }}-xwin-
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: make install
      - run: make package-windows-from-linux WINDOWS_OUT_DIR=${{ github.workspace }}/windows-out
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: ${{ github.workspace }}/windows-out/*.exe
          retention-days: 3
          if-no-files-found: error

  # Boot the REAL cross-built .exe on windows-latest (#206, ADR 0090 §B2): the
  # only job that proves the shipped artifact actually starts — window renders,
  # IPC answers, no critical console errors (tests/live/boot-smoke.live.spec.ts
  # over WebView2 CDP, clean first-run database). Same `make live-smoke` the
  # owner can run against any built exe. Git Bash shell: the target's recipe is
  # deliberately nix-less (it runs where the .exe runs — see the Makefile note).
  windows-boot-smoke:
    name: Windows boot smoke (real .exe)
    needs: [changes, windows-build]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: windows-out
      - name: Install WebView2 runtime
        # Server images ship no WebView2 runtime (proven by run 2's diagnostics:
        # process alive, backend logging, registry version EMPTY) — without it the
        # Tauri webview never starts and CDP stays silent. Evergreen Bootstrapper,
        # silent install. Infra step (gate-integrity INFRA_RUN_STEP_NAMES).
        shell: pwsh
        run: |
          $installer = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/silent","/install" -Wait
      - shell: bash
        # --disable-gpu: server images have no GPU; without it the WebView2 browser
        # process can die at startup (run 3: runtime installed, backend alive, no
        # msedgewebview2 → no CDP). Extra args are CI-only via this env seam.
        env:
          BRAWLER_EXTRA_BROWSER_ARGS: --disable-gpu
        run: make live-smoke EXE="$(ls windows-out/brawler-*-windows-x64-portable.exe | head -1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-smoke-screenshots
          path: |
            test-results/live/
            windows-out/data/logs/
            windows-out/live-capture/
          retention-days: 3
          if-no-files-found: ignore
