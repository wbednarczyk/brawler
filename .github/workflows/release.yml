# Continuous release, driven by the merged PR's release:* label (ADR 0090 §D).
#
# Every master push: `detect` finds the merged PR and its release label. skip →
# stop. Otherwise: compute the next version (last tag + label increment), build
# the Linux and Windows artifacts IN PARALLEL (version stamped into the
# manifests at build time), then — only after both builds — tag, publish the
# GitHub Release with git-cliff notes, and bot-commit the CHANGELOG.md entry
# TOGETHER WITH the version stamp (`chore(release): vX.Y.Z [skip ci]`, pushed
# over SSH with the release-stamp deploy key) so repo manifests always show the
# released version (ADR 0090 amendments, 2026-07-28). The tag still points at
# the exact tested SHA — the stamp commit lands after it.
#
# NO gate re-run before the build (ADR 0090 amendment, 2026-07-28): the server
# ruleset requires every full-check job green AND the branch up-to-date before
# merge, so the pushed master tree is bit-identical to the PR-tested tree —
# the same argument this workflow always used to skip tests for release:skip.
# Re-running the gate added ~8 min of latency to every release and could only
# fail on flakes.
#
# Rust caches (Swatinem/rust-cache, per-target shared-key) are SAVED on these
# master builds — a release recompiles only what changed since the previous
# release instead of cold-building both profiles every time.
#
# workflow_dispatch with `tag` re-publishes an existing tag's artifacts (recovery).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-publish, e.g. v0.62.0 (recovery only)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release intent
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      republish_tag: ${{ steps.detect.outputs.republish_tag }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "release=republish" >> "$GITHUB_OUTPUT"
            echo "republish_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A [skip ci] push (the changelog bot-commit) never triggers this
          # workflow — GitHub's native guard. Find the PR for this SHA.
          pr="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No PR for ${{ github.sha }} — treating as skip."
            echo "release=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          label="$(gh pr view "$pr" --json labels --jq '[.labels[].name | select(startswith("release:"))] | .[0] // ""')"
          echo "PR #$pr label: ${label:-<none>}"
          case "$label" in
            release:major) echo "release=major" >> "$GITHUB_OUTPUT" ;;
            release:minor) echo "release=minor" >> "$GITHUB_OUTPUT" ;;
            release:patch) echo "release=patch" >> "$GITHUB_OUTPUT" ;;
            *) echo "release=skip" >> "$GITHUB_OUTPUT" ;;
          esac

  version:
    name: Compute release version
    needs: detect
    if: needs.detect.outputs.release != 'skip'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prev: ${{ steps.version.outputs.prev }}
      republish: ${{ steps.version.outputs.republish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute release version
        id: version
        run: |
          set -euo pipefail
          rel="${{ needs.detect.outputs.release }}"
          if [ "$rel" = "republish" ]; then
            tag="${{ needs.detect.outputs.republish_tag }}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "republish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          last="${last:-v0.0.0}"
          IFS=. read -r MA MI PA <<< "${last#v}"
          case "$rel" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          version="$MA.$MI.$PA"
          echo "Previous tag: $last → new version: v$version ($rel)"
          echo "prev=$last" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "republish=false" >> "$GITHUB_OUTPUT"

  # The two artifact builds run in parallel — wall-clock is max(linux, windows)
  # instead of their sum. Each stamps the version into the manifests at build
  # time (no commit) via its make target.
  build-linux:
    name: Linux artifacts (deb/rpm/AppImage)
    needs: [detect, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      # Linux bundling prerequisites (deb/rpm/AppImage) — not needed for the
      # Windows cross-build, so only this job installs them.
      - name: Install host packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils file libfuse2t64 \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config rpm squashfs-tools zip

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Saved on every run (this workflow only runs on master pushes/dispatch),
      # keyed per target so the linux and windows caches never clobber each other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-linux
          save-if: true

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - run: make install

      - name: Build Linux release artifacts
        run: make package-release-linux VERSION=${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: release-artifacts/*
          retention-days: 3
          if-no-files-found: error

  build-windows:
    name: Windows portable (cargo-xwin)
    needs: [detect, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-windows
          save-if: true

      - name: Cache cargo-xwin SDK data
        uses: actions/cache@v6
        with:
          path: .xwin-cache
          key: ${{ runner.os }}-xwin-${{ hashFiles('flake.lock') }}
          restore-keys: ${{ runner.os }}-xwin-

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - run: make install

      - name: Build Windows release artifact
        run: make package-release-windows VERSION=${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: release-artifacts/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [detect, version, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -maxdepth 1 -type f -print -exec file {} \;

      # Preflight the stamp-push path BEFORE the tag exists (v0.61.3
      # postmortem, 2026-07-28): the stamp step pushes to the protected master
      # with the release-stamp deploy key, so a broken push path must fail the
      # release HERE — never after the tag/release shipped (which leaves master
      # permanently unstamped). The check probes CAPABILITY, not configuration:
      # the first version read the ruleset's bypass_actors over the API, but
      # that field is admin-only and GITHUB_TOKEN sees null — a false negative
      # that failed the v0.61.5 rerun with the bypass correctly configured.
      # The SSH probe below proves the secret holds a key GitHub accepts FOR
      # THIS REPO (a deploy key's auth banner names its repository); the
      # ruleset read stays as best-effort — it hard-fails only on a POSITIVE
      # "no DeployKey bypass" reading, and skips when the field is unreadable.
      - name: Preflight release-stamp push path
        env:
          RELEASE_STAMP_DEPLOY_KEY: ${{ secrets.RELEASE_STAMP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_STAMP_DEPLOY_KEY" ]; then
            echo "RELEASE_STAMP_DEPLOY_KEY secret is missing — the changelog/version stamp cannot push to master." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$RELEASE_STAMP_DEPLOY_KEY" > ~/.ssh/release_stamp
          chmod 600 ~/.ssh/release_stamp
          auth_banner=$(ssh -i ~/.ssh/release_stamp -o IdentitiesOnly=yes -T git@github.com 2>&1 || true)
          case "$auth_banner" in
            *"${{ github.repository }}"*"successfully authenticated"*)
              echo "release-stamp deploy key authenticates for ${{ github.repository }}." ;;
            *)
              echo "RELEASE_STAMP_DEPLOY_KEY does not authenticate as a deploy key of ${{ github.repository }}:" >&2
              echo "$auth_banner" >&2
              exit 1 ;;
          esac
          verdicts=$(gh api "repos/${{ github.repository }}/rulesets" --jq '.[].id' 2>/dev/null | while read -r id; do
            gh api "repos/${{ github.repository }}/rulesets/$id" 2>/dev/null | jq -r '
              select((.rules // [] | map(.type) | index("pull_request")) != null)
              | if .bypass_actors == null then "unreadable"
                elif ([.bypass_actors[].actor_type] | index("DeployKey")) != null then "ok"
                else "missing"
                end'
          done || true)
          if printf '%s\n' "$verdicts" | grep -q '^missing$'; then
            echo "A pull_request ruleset has NO DeployKey bypass — the stamp push would be rejected (GH013)." >&2
            exit 1
          fi
          if ! printf '%s\n' "$verdicts" | grep -q '^ok$'; then
            echo "Ruleset bypass not verifiable with this token (bypass_actors is admin-only) — the SSH probe above is the effective guard."
          fi

      # Tag AFTER both successful builds so a failed build never orphans a tag.
      # Idempotent: skip if the tag already exists (recovery re-runs).
      - name: Create and push tag
        if: needs.version.outputs.republish == 'false'
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — skipping tag creation."
          else
            # Annotated tags need a committer identity; a bare runner has none
            # ("fatal: empty ident name" — first real release, 2026-07-28).
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Generate release notes (git-cliff)
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          prev="${{ needs.version.outputs.prev }}"
          range="${prev:+$prev..}$tag"
          nix develop -c git-cliff --config cliff.toml $range --tag "$tag" --strip header > release-notes.md || \
            printf "Release %s\n" "$tag" > release-notes.md
          cat release-notes.md

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-artifacts/*

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* --title "$tag" --notes-file release-notes.md
          fi

      # Prepend the entry to CHANGELOG.md AND stamp the released version into
      # the repo manifests, one bot-commit on master ([skip ci] so it does not
      # re-trigger this workflow). The push goes over SSH with the release-stamp
      # deploy key — GITHUB_TOKEN cannot bypass the master ruleset on a personal
      # repo (v0.61.3 postmortem, 2026-07-28); the ruleset grants the DeployKey
      # bypass and the preflight step asserts both halves before the tag exists.
      # Race handling: each attempt regenerates the commit on a fresh
      # origin/master instead of rebasing lockfiles — a concurrent merge can
      # never produce a conflict (ADR 0090 amendment, 2026-07-28).
      # Deliberately NOT gated on `republish == 'false'`: the step is idempotent
      # ("Nothing left to commit"), and a republish recovery run must be able to
      # heal a stamp its failed predecessor never landed (the v0.61.2 hole).
      - name: Commit changelog and version stamp
        env:
          RELEASE_STAMP_DEPLOY_KEY: ${{ secrets.RELEASE_STAMP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$RELEASE_STAMP_DEPLOY_KEY" > ~/.ssh/release_stamp
          chmod 600 ~/.ssh/release_stamp
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/release_stamp -o IdentitiesOnly=yes"
          tag="${{ needs.version.outputs.tag }}"
          version="${{ needs.version.outputs.version }}"
          # Explicit range, NOT --unreleased: this step runs AFTER the tag step,
          # so "unreleased" (= commits since the last tag) is empty by definition
          # (v0.61.1 postmortem, 2026-07-28) — same range as the release-notes step.
          prev="${{ needs.version.outputs.prev }}"
          range="${prev:+$prev..}$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3; do
            git fetch origin master
            # Drop the build-time stamp + any prior attempt; rebuild on fresh tip.
            git checkout -f -B master origin/master
            # Idempotence on re-runs: skip pieces that already landed.
            current="$(node -p "require('./package.json').version")"
            if [ "$current" != "$version" ]; then
              node scripts/release/bump-version.mjs "$version"
            fi
            if ! grep -q "^## $tag " CHANGELOG.md; then
              nix develop -c git-cliff --config cliff.toml $range --tag "$tag" --prepend CHANGELOG.md
            fi
            git add CHANGELOG.md package.json package-lock.json \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json \
              src-tauri/src/lib.rs
            # A release whose commits are all changelog-filtered types still
            # stamps the version; fully-empty means everything already landed.
            if git diff --cached --quiet; then echo "Nothing left to commit for $tag."; ok=1; break; fi
            git commit -m "chore(release): $tag [skip ci]"
            if git push "git@github.com:${{ github.repository }}.git" HEAD:master; then ok=1; break; fi
            echo "release-stamp push attempt $i failed; retrying…"; sleep 5
          done
          if [ "$ok" -ne 1 ]; then echo "Failed to push changelog + version stamp after 3 attempts" >&2; exit 1; fi
