# Tests-touched gate (G14, hard gates wave 2, ADR 0045 harvest 2026-09-08):
# a PR's code diff must carry a test change (or, for Rust, an inline
# #[cfg(test)]/#[test] hunk in the same diff) or the `tests:not-needed` label.
#
# Lives OUTSIDE full-check.yml on purpose, same rationale as release-label.yml:
# this is the only check besides that one that must re-evaluate on
# labeled/unlabeled events (adding `tests:not-needed` flips a red PR green
# without a new push). Keeping it here means a label event re-runs a ~seconds
# job instead of the whole gate — the heavy checks' green on the same SHA
# stays untouched, and an in-flight full-check run is not cancelled by
# labeling.
name: Tests touched

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: tests-touched-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-touched:
    name: Tests touched (test change or tests:not-needed)
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - name: Fetch current PR labels
        # A manual re-run of an old job replays THAT event's payload, whose
        # label snapshot can be stale (a label added/removed since). Fetch
        # the CURRENT labels live at check time instead of trusting the
        # triggering event's payload, so a re-run always evaluates against
        # the PR's actual label state.
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '[.[].name]')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
      - name: Check tests touched
        # Labels arrive as a JSON array via env — never interpolated into the
        # shell line (so a label like `foo"; rm -rf /` cannot escape into the
        # recipe) and never comma-joined (a label whose own name contains a
        # comma, e.g. "review,tests:not-needed", must not fragment into a
        # false match — G14).
        env:
          PR_LABELS: ${{ steps.labels.outputs.labels }}
        run: make check-tests-touched RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
