name: Mutation testing sweep

# Manual-only (CI Posture, docs/engineering-workflow.md): no push/paths trigger,
# no schedule. cargo-mutants sweeps take 30 min-2 h and rebuild+retest per
# mutant, so they run off the owner's WSL box (which OOM-froze twice running
# this locally) on a standard ubuntu-latest runner instead, on demand:
#   gh workflow run mutants.yml [-f shard=1/8] [-f build_jobs=4]
on:
  workflow_dispatch:
    inputs:
      shard:
        description: 'cargo-mutants shard, e.g. "1/8" (empty = full sweep)'
        required: false
        default: ""
      build_jobs:
        description: "CARGO_BUILD_JOBS for the mutant/baseline builds"
        required: false
        default: "4"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants sweep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Reclaim disk space
        # A sweep writes a full scratch tree + per-mutant rebuild artifacts for
        # 30min-2h; two 2026-07-29 runs died mid-sweep with the runner agent lost
        # (no logs uploaded) — the progressive-disk-exhaustion signature. Same
        # reclaim the full-check heavy jobs use (~25-30 GB freed).
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      - name: Add swap
        # Third 2026-07-29 death: reclaim ran, sweep progressed 27 min, runner
        # still got a shutdown signal — pointing at OOM, not disk (this sweep
        # also OOM-froze the owner's 16 GB WSL twice; the local memory jail is
        # off here). Swap lets linking/test spikes page instead of killing the
        # runner agent.
        run: |
          sudo fallocate -l 8G /mnt/extra-swap
          sudo chmod 600 /mnt/extra-swap
          sudo mkswap /mnt/extra-swap
          sudo swapon /mnt/extra-swap
          free -h
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-
            ${{ runner.os }}-cargo-

      # Nix (not a bare rust-toolchain action) because `make mutants` shells
      # out via `$(NIX) = nix develop -c`: the default devShell (flake.nix)
      # already pins the Rust toolchain, cargo-mutants, cargo-nextest, and the
      # Linux Tauri system libraries (gtk3, webkitgtk_4_1, ...) needed to
      # compile src-tauri, so no separate rustup/apt-get step is needed here —
      # this mirrors how release.yml builds the same Rust workspace.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No jail: MUTANTS_JAIL=off skips the systemd-run --user memory jail
      # (Makefile), which needs a user systemd manager that a GitHub-hosted
      # runner does not have. cargo-mutants exits non-zero when mutants are
      # MISSED (or on a build/test error) — that non-zero is the intended
      # signal for this job to go red, so the run is NOT forced green; the
      # artifact upload below is unconditional (`if: always()`) so the report
      # is still available when the job fails on missed mutants.
      - name: Run mutation sweep
        # The TELEMETRY loop streams disk/memory into the live log every 60s —
        # the only channel that survives a runner death (artifacts and later
        # steps do not run when the agent is lost).
        run: |
          ( while true; do
              echo "TELEMETRY $(date -u +%H:%M:%S) disk_avail=$(df --output=avail -h / | tail -1 | xargs) mem_avail_mb=$(free -m | awk '/Mem:/{print $7}') swap_used_mb=$(free -m | awk '/Swap:/{print $3}')"
              sleep 60
            done ) &
          TELEM_PID=$!
          rc=0
          make mutants MUTANTS_JAIL=off \
            MUTANTS_BUILD_JOBS=${{ inputs.build_jobs }} \
            MUTANTS_SHARD=${{ inputs.shard }} || rc=$?
          kill "$TELEM_PID" 2>/dev/null || true
          exit "$rc"

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out
          path: src-tauri/mutants.out
          retention-days: 7
          if-no-files-found: warn
