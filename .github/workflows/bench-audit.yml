# Bench audit (ADR 0096): base-vs-head on the SAME runner, manually dispatched.
# Advisory — a red run files a card, never blocks a merge. Absolute wall-clock
# is never compared across machines.
name: Bench audit
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref/SHA (default: merge-base of origin/master and the dispatched ref)"
        required: false
        default: ""
permissions:
  contents: read
  # G13 (gate-integrity.mjs, finding 4 / ADR 0045 harvest 2026-09-08): this
  # workflow's header says "Advisory" — advisory must never mean silent, so
  # a red run needs somewhere to go. The carding step below needs this to
  # open an issue.
  issues: write
concurrency:
  group: bench-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench-audit:
    name: Bench base vs head (same runner)
    runs-on: ubuntu-latest
    container: ghcr.io/wbednarczyk/brawler-devshell:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fix workspace ownership
        # Container jobs: the runner mounts the workspace with a uid that differs
        # from the container user; Nix's libgit2 then refuses the flake git input
        # ("repository path is not owned by current user"). No-op outside containers.
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bench
      - name: Bench base vs head
        id: bench
        env:
          BASE: ${{ inputs.base }}
        run: |
          rc=0
          make audit-bench-ci || rc=$?
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"

      # Finding 4 (ADR 0045 harvest 2026-09-08), the same G3b pattern as
      # mutation-audit.yml: a red run (bench-compare.mjs exit 1 = regression,
      # 2 = malformed/error, or the step never producing an `rc` at all)
      # files a tracked issue, idempotent per commit so a rerun never
      # duplicates it. `if: always()` so this fires even though "Bench base
      # vs head" exits non-zero on a regression.
      - name: File advisory issue for a bench regression
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.bench.outputs.rc }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rc="${RC:-}"
          if [ "$rc" = "0" ]; then
            echo "advisory: bench audit passed — nothing to card."
            exit 0
          fi

          gh label create bench --color BFD4F2 \
            --description "bench-audit advisory findings (ADR 0096)" --force || true

          short_sha="${GITHUB_SHA:0:7}"
          if [ -z "$rc" ]; then
            headline="bench audit did not complete"
          else
            headline="regression detected (exit ${rc})"
          fi
          title="bench-audit: ${headline} on ${short_sha}"

          existing=$(gh issue list --repo "$REPO" --label bench --state open \
            --search "$title in:title" --json title \
            --jq ".[] | select(.title == \"${title}\") | .title" || true)
          if [ -n "$existing" ]; then
            echo "advisory: an open issue already carries this exact title — skipping: $title"
            exit 0
          fi

          {
            echo "Run: ${RUN_URL}"
            echo ""
            echo "- exit code: \`${rc:-<unset>}\`"
          } >/tmp/bench-audit-issue-body.md

          gh issue create --repo "$REPO" --title "$title" \
            --body-file /tmp/bench-audit-issue-body.md \
            --label bench,area:testing,priority:low || true
