name: Bug report
description: Report a defect in Brawler
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (Settings → About, or the release tag), e.g. v0.61.0
      placeholder: v0.61.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that trigger the problem.
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant log output, console errors, or screenshots. Redact anything sensitive.
      render: shell
    validations:
      required: false
