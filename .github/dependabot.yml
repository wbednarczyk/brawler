# Dependabot (ADR 0090). Monthly, grouped (minor+patch in one PR per block)
# to keep review load and CI minutes low. Cargo lives under /src-tauri.
#
# Labels: every PR MUST carry exactly one release:* label (the release-label
# required check). Rule of thumb — user impact decides:
#   - runtime deps (cargo/npm production) ship in the app  -> release:patch
#     (merging the grouped bump releases a patch automatically)
#   - dev-only deps and GitHub Actions never ship          -> release:skip
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: production
    labels: [dependencies, "release:patch"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      cargo-prod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: development
    labels: [dependencies, "release:skip"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dev deps never ship — majors ride the same monthly PR (one red major
      # can't block shipped updates here, unlike the prod groups).
      cargo-dev-all:
        update-types: [major, minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: production
    labels: [dependencies, "release:patch"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-prod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: development
    ignore:
      # @types/node's major tracks the Node runtime, and the toolchain pins
      # nodejs_22 (flake.nix). Types for a newer Node describe APIs this runtime
      # does not have, so a green typecheck would stop meaning "runs" — the bump
      # rides a deliberate Node upgrade, never dependabot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, "release:skip"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dev deps never ship — majors ride the same monthly PR.
      npm-dev-all:
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, "release:skip"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Actions never ship in the app — majors ride the same monthly PR.
      actions-all:
        update-types: [major, minor, patch]
