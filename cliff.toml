# git-cliff configuration for Brawler.
# Historical entries before v0.25.0 are curated from docs/kanban-archive.md.
# Future entries are generated from Conventional Commits.

[changelog]
header = """
# Changelog

All notable project changes are recorded here.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}

{% endfor %}\
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "changed" },
  { message = "^refactor", group = "changed" },
  { message = "^docs", group = "documentation" },
  { message = "^test", group = "tests" },
  { message = "^build", group = "build" },
  { message = "^ci", group = "build" },
  { message = "^chore\\(release\\)", group = "release" },
  { message = "^chore", group = "maintenance" },
]
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
