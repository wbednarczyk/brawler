# git-cliff configuration for Brawler.
# Historical entries before v0.25.0 are curated from docs/kanban-archive.md.
# Future entries are generated from Conventional Commits.

[changelog]
header = "# Changelog\n\n"
# This template produces a clean scaffold (one line per commit, with scope).
# Detailed, user-facing release notes are curated by hand on top of this scaffold
# before the release commit — see the curation step in the release workflow. A
# fully-automatic body render is deliberately avoided: git-cliff's footer parser
# truncates structured commit bodies (lines like "Backend:" are read as footers).
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
# ADR 0090 continuous release: commit descriptions ARE the release notes, so only
# user-facing types surface — feat/fix/perf. Everything else (refactor/docs/test/
# build/ci/chore/style) is filtered from the generated CHANGELOG entry.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", skip = true },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
