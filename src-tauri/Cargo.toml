[package]
name = "brawler"
version = "0.42.0"
description = "Local-first investor research workspace"
authors = ["Brawler contributors"]
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "brawler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
quick-xml = "0.39"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
