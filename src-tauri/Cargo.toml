[package]
name = "brawler"
version = "0.1.0"
description = "Local-first investor research workspace"
authors = ["Brawler contributors"]
edition = "2021"
publish = false

[lib]
name = "brawler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
