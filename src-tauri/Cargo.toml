[package]
name = "brawler"
version = "0.63.9"
description = "Local-first investor research workspace"
authors = ["Brawler contributors"]
license = "MPL-2.0"
edition = "2021"
publish = false
# The crate ships two binaries (the Tauri app `brawler` + the `brawler-mcp-stdio`
# MCP adapter, ADR 0078 dec. 6), so cargo/tauri need to know which is the app.
default-run = "brawler"

[lib]
name = "brawler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Generate the TypeScript API types from the Rust DTOs (ADR 0048). OFF by
# default so `ts-rs` stays out of the shipped binary; `make types` enables it to
# emit src/api/generated/, and `make types-check` regenerates + fails on drift.
ts-export = ["dep:ts-rs"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
ed25519-dalek = "2"
# OS-entropy RNG for the MCP bearer token (ADR 0078 decision 4). Pure Rust,
# already in the tree transitively (same 0.3.x line) — promoted to a direct
# dependency; no new version enters the lockfile.
getrandom = "0.3"
# `form` is explicit since 0.13: url-encoded bodies moved behind their own
# feature, and the GPW listing / KNF short-selling adapters POST forms. The
# other three carry over unchanged — note `default-tls` switched to rustls in
# 0.13, which is why `native-tls` stays spelled out rather than implied.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
quick-xml = "0.41"
r2d2 = "0.8"
libc = "0.2"
pdf-extract = "0.12"
r2d2_sqlite = "0.25"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-str"] }
# MCP tool input/output JSON Schemas are GENERATED from the serde types (ADR
# 0088 dec. 1) — never hand-written. 1.x is already resolved in the lockfile
# transitively (Tauri's side of the tree), so tracking it adds no new crate
# version and drops a duplicate. Pure Rust; cross-compiles to windows-msvc via
# cargo-xwin. The emitted schemas are the frozen tool contract (ADR 0078 G-1) —
# see `mcp::tools::tool_schema` for what this version's defaults required.
schemars = "1"
scraper = "0.22"
semver = "1"
similar = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
# In-app read-only MCP server transport (ADR 0078 dec. 2). Pure-Rust, three small
# transitive deps, synchronous handlers call the blocking `AppState` directly (no
# tokio feature changes) — cross-compiles to windows-msvc via cargo-xwin.
tiny_http = "0.12"
# Listener construction with SO_REUSEADDR for the MCP server (pure Rust; already
# transitive in-tree). See mcp/server.rs.
socket2 = "0.6"
# Only the async `sync` primitives (Semaphore) for the per-provider concurrency
# gate (ADR 0059). tokio is already in the tree via tauri; features are unified,
# so this pins no new version — it just makes `tokio::sync` a direct import.
tokio = { version = "1", features = ["sync"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
ts-rs = { version = "12", optional = true }
url = "2"
# ESEF report packages (ADR 0061 dec. 1) are ZIP containers; only DEFLATE is
# needed to read the inline-XBRL instance inside (no encryption/bzip2/zstd).
# Pins to the version already resolved transitively, so no new version enters.
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Property-based tests for the deterministic cores (DSL parser/evaluator, feed
# dedup) and the data-transform invariant layer (ADR 0049). Test-only; not
# shipped in the binary.
proptest = "1"
# Golden snapshots of source-adapter parse outputs and normalization results
# (ADR 0049). Reviewable, regenerated not hand-edited (`cargo insta` / INSTA_UPDATE).
insta = "1"
# Periodic micro-benchmarks of the hot data-transform kernels (ADR 0049, T5):
# RSS parse, formula parse. `make bench`; never a hard gate
# (wall-clock is machine-dependent) — the bench-ratchet flags relative regressions.
criterion = "0.5"

# Thin stdio↔HTTP adapter for the read-only MCP server (ADR 0078 decision 6):
# a dumb line→POST pipe with no protocol knowledge, over `reqwest::blocking`
# (already in the tree). Shipped alongside the app for stdio-only MCP clients.
[[bin]]
name = "brawler-mcp-stdio"
path = "src/bin/brawler-mcp-stdio.rs"

[[bench]]
name = "transforms"
harness = false
