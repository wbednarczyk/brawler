[package]
name = "brawler"
version = "0.49.0"
description = "Local-first investor research workspace"
authors = ["Brawler contributors"]
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "brawler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# On-device embedding model for the interpretative AI layer (ADR 0035, v0.45.0).
# OFF by default so the standard `make check`/CI build stays fast and offline:
# the candle inference engine and hf-hub downloader are heavy and only needed for
# the opt-in embedding similarity strategy. Release/dev builds and the periodic
# model eval enable this feature; with it off, the registry reports the embedding
# strategy as unavailable and the static (lexical) baseline serves similarity.
embedding-model = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

# Generate the TypeScript API types from the Rust DTOs (ADR 0048). OFF by
# default so `ts-rs` stays out of the shipped binary; `make types` enables it to
# emit src/api/generated/, and `make types-check` regenerates + fails on drift.
ts-export = ["dep:ts-rs"]

[dependencies]
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
# `fancy-regex` is the pure-Rust regex backend (vs the default `onig`/C oniguruma),
# so the whole engine stays pure-Rust and cross-compiles to windows-msvc via
# cargo-xwin. Weights are fetched with the existing `reqwest` (native-tls/SChannel),
# not `hf-hub` (which pulls ureq+rustls+ring and fails the cross-build).
tokenizers = { version = "0.21", optional = true, default-features = false, features = [
    "fancy-regex",
] }
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
# Pure-Rust HNSW approximate nearest-neighbour index (ADR 0050 decision 6) behind
# the `VectorIndex` swap boundary. Pure Rust (no C/native deps) so it keeps the
# cargo-xwin Linux->Windows cross-build working — `sqlite-vec` was rejected for
# exactly that reason.
instant-distance = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
quick-xml = "0.39"
r2d2 = "0.8"
libc = "0.2"
pdf-extract = "0.7"
r2d2_sqlite = "0.25"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-str"] }
scraper = "0.22"
semver = "1"
similar = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
thiserror = "2"
# Only the async `sync` primitives (Semaphore) for the per-provider concurrency
# gate (ADR 0059). tokio is already in the tree via tauri; features are unified,
# so this pins no new version — it just makes `tokio::sync` a direct import.
tokio = { version = "1", features = ["sync"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
ts-rs = { version = "12", optional = true }
url = "2"

[dev-dependencies]
# Property-based tests for the deterministic cores (DSL parser/evaluator, feed
# dedup) and the data-transform invariant layer (ADR 0049). Test-only; not
# shipped in the binary.
proptest = "1"
# Golden snapshots of source-adapter parse outputs and normalization results
# (ADR 0049). Reviewable, regenerated not hand-edited (`cargo insta` / INSTA_UPDATE).
insta = "1"
# Periodic micro-benchmarks of the hot data-transform kernels (ADR 0049, T5):
# similarity scan, RSS parse, formula parse. `make bench`; never a hard gate
# (wall-clock is machine-dependent) — the bench-ratchet flags relative regressions.
criterion = "0.5"

[[bench]]
name = "transforms"
harness = false
